name: Release Chrome extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Verify release tag and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and run tests
        run: npm run typecheck && npm test

      - name: Build and verify release archive
        run: npm run package:release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
